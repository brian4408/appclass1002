<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf6ec">
  <title>今天吃什麼？｜餐廳轉盤</title>
  <style>
    :root{--paper:#fbf6ec;--ink:#29352f;--muted:#778078;--green:#365e49;--orange:#ef8058;--line:#e7e2d8;--card:#fffdf8;--shadow:0 22px 65px #39453612}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}
    .page{max-width:1180px;margin:auto;padding:26px 38px 54px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:42px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.02em}.brand-icon{width:38px;height:38px;background:#e6ede0;border-radius:13px;display:grid;place-items:center;font-size:21px}.top-note{color:var(--muted);font-size:13px}.hero{text-align:center;margin-bottom:29px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.17em;font-weight:800;color:#b56e4d}.hero h1{font-size:clamp(32px,5vw,48px);line-height:1.12;margin:11px 0 9px;letter-spacing:-.04em}.hero p{color:var(--muted);margin:0;font-size:15px}.layout{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(300px,.82fr);gap:24px;align-items:start}.card{background:var(--card);border:1px solid #eee9df;border-radius:23px;box-shadow:var(--shadow)}.wheel-card{padding:25px 28px 23px;text-align:center;overflow:hidden}.wheel-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}.section-title{font-size:15px;font-weight:800}.count{font-size:12px;color:var(--muted);background:#f3f0e8;padding:7px 11px;border-radius:20px}.wheel-wrap{width:min(100%,470px);aspect-ratio:1;margin:0 auto;position:relative;display:grid;place-items:center}.wheel-wrap:after{content:"";position:absolute;inset:9px;border-radius:50%;border:1px solid #29352f12;pointer-events:none}.pointer{position:absolute;z-index:3;top:-1px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:29px solid #354b3b;filter:drop-shadow(0 3px 3px #0002)}canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 13px #29352f1a)}.spin-center{position:absolute;z-index:2;width:68px;height:68px;border-radius:50%;background:#fffdf8;border:7px solid #f3eee4;box-shadow:0 2px 9px #00000012;display:grid;place-items:center;color:var(--green);font-size:22px}.wheel-controls{display:flex;justify-content:center;gap:10px;margin:18px 0 0}.primary,.secondary{border:0;border-radius:14px;padding:13px 23px;font-weight:800;transition:.18s transform,.18s background}.primary{background:var(--green);color:white;box-shadow:0 6px 15px #365e4930}.primary:hover{background:#294d39;transform:translateY(-1px)}.secondary{background:#f1eee6;color:#465148}.secondary:hover{background:#e9e5dc}.primary:disabled{opacity:.5;cursor:not-allowed;transform:none}.status{height:22px;margin-top:10px;color:var(--muted);font-size:13px}.side{display:grid;gap:18px}.list-card{padding:22px}.list-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.list-top h2{font-size:17px;margin:0}.subtext{font-size:12px;color:var(--muted);margin:0 0 16px}.add-form{display:flex;gap:8px;margin-bottom:14px}.add-form input{min-width:0;flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;outline:none}.add-form input:focus{border-color:#8ca58f;box-shadow:0 0 0 3px #8ca58f20}.add-btn{border:0;width:43px;border-radius:12px;background:#e7eee4;color:var(--green);font-size:23px;font-weight:500}.restaurant-list{list-style:none;margin:0;padding:0;display:grid;gap:7px;max-height:255px;overflow:auto}.restaurant-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:11px;background:#faf8f2;font-size:13px}.restaurant-item .dot{width:9px;height:9px;border-radius:50%;flex:none}.restaurant-item span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.remove-btn{border:0;background:transparent;color:#9a9c94;font-size:18px;width:24px;height:24px;border-radius:6px;line-height:1}.remove-btn:hover{background:#f0e8df;color:#bd5b45}.empty-list{color:#999e94;text-align:center;padding:23px 10px;font-size:13px}.clear-row{border:0;background:none;color:#9b6d5b;font-size:12px;padding:12px 0 0}.result-card{padding:19px 21px 21px;background:#f0f3e9;border-color:#e4e9de}.result-label{font-size:11px;letter-spacing:.12em;color:#71816f;font-weight:800}.result-name{font-size:24px;line-height:1.2;font-weight:850;margin:7px 0 14px;min-height:29px;overflow-wrap:anywhere}.result-name.placeholder{font-size:15px;font-weight:600;color:#899187;margin:10px 0 17px}.result-actions{display:flex;gap:8px}.result-actions button{flex:1;padding:10px 9px;font-size:12px;border-radius:10px}.result-hint{font-size:11px;color:#7f897d;margin:10px 0 0}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#29352f;color:white;border-radius:12px;padding:11px 16px;font-size:13px;transition:.22s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:760px){.page{padding:17px 17px 35px}.topbar{margin-bottom:32px}.top-note{display:none}.hero{margin-bottom:23px}.layout{grid-template-columns:1fr;gap:15px}.wheel-card{padding:19px 15px 17px}.wheel-wrap{width:min(100%,400px)}.side{gap:13px}.list-card{padding:19px}.restaurant-list{max-height:220px}.result-card{padding:17px 19px}.wheel-controls{margin-top:14px}}
    @media(max-width:380px){.wheel-wrap{width:100%}.hero h1{font-size:32px}.wheel-card{padding-left:10px;padding-right:10px}.primary,.secondary{padding:12px 17px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar"><div class="brand"><div class="brand-icon">🥢</div><span>今天吃什麼？</span></div><div class="top-note">把選擇交給一點好運氣 ✨</div></header>
    <section class="hero"><div class="eyebrow">A little spin, a lovely meal</div><h1>今天吃什麼？</h1><p>把煩惱交給轉盤，下一餐就有答案。</p></section>
    <section class="layout" aria-label="餐廳抽選工具">
      <div class="card wheel-card"><div class="wheel-head"><div class="section-title">今天的美食轉盤</div><div class="count" id="wheelCount">0 家餐廳</div></div><div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><canvas id="wheel" aria-label="餐廳隨機轉盤"></canvas><div class="spin-center" aria-hidden="true">✦</div></div><div class="wheel-controls"><button class="primary" id="spinBtn">開始抽選　↗</button><button class="secondary" id="againBtn">再抽一次</button></div><div class="status" id="status" aria-live="polite">新增幾家餐廳，開始今天的美食冒險吧！</div></div>
      <aside class="side"><section class="card list-card"><div class="list-top"><h2>我的餐廳清單</h2></div><p class="subtext">新增常去的店，清單會自動保存在這台裝置。</p><form class="add-form" id="addForm"><input id="restaurantInput" type="text" maxlength="30" placeholder="例如：巷口牛肉麵" aria-label="輸入餐廳名稱" autocomplete="off"><button class="add-btn" type="submit" aria-label="新增餐廳">＋</button></form><ul class="restaurant-list" id="restaurantList"></ul><button class="clear-row" id="clearBtn" type="button">清空餐廳清單</button></section>
      <section class="card result-card"><div class="result-label">✦　LUCKY PICK</div><div class="result-name placeholder" id="resultName" aria-live="polite">等你轉出今天的美味！</div><div class="result-actions"><button class="primary" id="resultSpinBtn">幫我決定</button><button class="secondary" id="copyBtn">複製結果</button></div><p class="result-hint">不滿意這次的選擇？再轉一次就好。</p></section></aside>
    </section>
  </main><div class="toast" id="toast" role="status"></div>
<script>
(() => {
  const STORAGE_KEY='food-wheel-restaurants-v1';
  const palette=['#e99b75','#a8bd9d','#e6c66f','#8eaab1','#d59ca1','#c6b0d4','#e9b879','#9bb8a9','#df8e69','#b6bd83'];
  let restaurants=[]; let rotation=0; let spinning=false; let lastWinner=''; let toastTimer;
  const canvas=document.getElementById('wheel'), ctx=canvas.getContext('2d');
  const listEl=document.getElementById('restaurantList'), countEl=document.getElementById('wheelCount');
  const spinBtn=document.getElementById('spinBtn'), againBtn=document.getElementById('againBtn'), resultSpinBtn=document.getElementById('resultSpinBtn');
  function load(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');restaurants=Array.isArray(saved)?saved.filter(x=>typeof x==='string').slice(0,100):[]}catch{restaurants=[]}}
  function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(restaurants))}catch{showToast('無法儲存，請檢查瀏覽器設定。')}}
  function resizeCanvas(){const rect=canvas.getBoundingClientRect();if(!rect.width)return;const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);drawWheel()}
  function drawWheel(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;ctx.clearRect(0,0,w,h);const cx=w/2,cy=h/2,r=Math.min(w,h)/2-11;ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation);const n=Math.max(restaurants.length,1),arc=Math.PI*2/n;
    if(!restaurants.length){ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fillStyle='#f0eee6';ctx.fill();ctx.strokeStyle='#fffdf8';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#9ba196';ctx.font='600 15px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('先新增餐廳',0,-r*.65);ctx.restore();return}
    restaurants.forEach((name,i)=>{const start=-Math.PI/2+i*arc,end=start+arc;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,start,end);ctx.closePath();ctx.fillStyle=palette[i%palette.length];ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fffdf8';ctx.stroke();const mid=start+arc/2;ctx.save();ctx.rotate(mid);ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle='#29352f';let fontSize=Math.max(10,Math.min(15,Math.floor(160/n+8)));ctx.font=`700 ${fontSize}px system-ui, sans-serif`;let label=name.length>13?name.slice(0,12)+'…':name;ctx.fillText(label,r-18,0,Math.max(42,r*.62));ctx.restore()});ctx.restore()}
  function renderList(){listEl.replaceChildren();countEl.textContent=`${restaurants.length} 家餐廳`;if(!restaurants.length){const li=document.createElement('li');li.className='empty-list';li.textContent='清單還是空的，新增一家喜歡的店吧。';listEl.append(li)}else restaurants.forEach((name,i)=>{const li=document.createElement('li');li.className='restaurant-item';const dot=document.createElement('span');dot.className='dot';dot.style.background=palette[i%palette.length];const label=document.createElement('span');label.textContent=name;const remove=document.createElement('button');remove.className='remove-btn';remove.type='button';remove.setAttribute('aria-label',`移除${name}`);remove.textContent='×';remove.addEventListener('click',()=>{restaurants.splice(i,1);save();renderList();drawWheel()});li.append(dot,label,remove);listEl.append(li)});spinBtn.disabled=restaurants.length===0||spinning;againBtn.disabled=restaurants.length===0||spinning;resultSpinBtn.disabled=restaurants.length===0||spinning}
  function showToast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
  function setWinner(name){lastWinner=name;const el=document.getElementById('resultName');el.textContent=name;el.classList.remove('placeholder');document.getElementById('status').textContent=`命運選中了「${name}」！祝你用餐愉快。`}
  function spin(){if(spinning||!restaurants.length)return;spinning=true;renderList();document.getElementById('status').textContent='轉呀轉，今天的美味即將揭曉…';const index=Math.floor(Math.random()*restaurants.length);const n=restaurants.length;const arc=Math.PI*2/n;const targetMod=((-(index+.5)*arc)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);const current=((rotation%(Math.PI*2))+Math.PI*2)%(Math.PI*2);const extra=(targetMod-current+Math.PI*2)%(Math.PI*2);const start=rotation;const target=rotation+Math.PI*2*(5+Math.floor(Math.random()*3))+extra;const duration=3900;let begin;
    function frame(now){if(!begin)begin=now;const t=Math.min(1,(now-begin)/duration);const ease=1-Math.pow(1-t,4);rotation=start+(target-start)*ease;drawWheel();if(t<1)requestAnimationFrame(frame);else{rotation=target%(Math.PI*2);drawWheel();spinning=false;renderList();setWinner(restaurants[index]);}}
    requestAnimationFrame(frame)}
  document.getElementById('addForm').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('restaurantInput'),name=input.value.trim();if(!name)return;if(restaurants.some(x=>x.toLowerCase()===name.toLowerCase())){showToast('這家餐廳已經在清單裡囉！');input.focus();return}if(restaurants.length>=100){showToast('餐廳清單最多可放 100 家。');return}restaurants.push(name);save();renderList();drawWheel();input.value='';input.focus();document.getElementById('status').textContent='新增成功！準備好就來轉盤抽選吧。'});
  [spinBtn,againBtn,resultSpinBtn].forEach(btn=>btn.addEventListener('click',spin));
  document.getElementById('clearBtn').addEventListener('click',()=>{if(!restaurants.length)return;if(!confirm('確定要清空所有餐廳嗎？'))return;restaurants=[];save();renderList();drawWheel();document.getElementById('status').textContent='清單已清空，隨時可以重新新增。';document.getElementById('resultName').textContent='等你轉出今天的美味！';document.getElementById('resultName').classList.add('placeholder');lastWinner=''});
  document.getElementById('copyBtn').addEventListener('click',async()=>{if(!lastWinner){showToast('先轉出一家餐廳再複製喔！');return}try{await navigator.clipboard.writeText(`今天吃：${lastWinner}`);showToast('已複製，祝你用餐愉快！')}catch{showToast(`今天吃：${lastWinner}`)}});
  window.addEventListener('resize',resizeCanvas);load();renderList();requestAnimationFrame(resizeCanvas);
})();
</script>
</body>
</html>
